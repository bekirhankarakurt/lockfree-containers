name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release from main (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          tag="v${VERSION_INPUT}"
          git config user.name "Bekirhan Karakurt"
          git config user.email "142732001+bekirhankarakurt@users.noreply.github.com"
          git tag -a "${tag}" -m "lockfree-containers ${VERSION_INPUT}"
          git push origin "${tag}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
      - name: Resolve tag (tag push)
        if: github.event_name == 'push'
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Check tag matches project version
        run: |
          version="${TAG#v}"
          grep -q "VERSION ${version}" CMakeLists.txt || { echo "tag ${TAG} != CMake version"; exit 1; }
          grep -q "## \[${version}\]" CHANGELOG.md || { echo "CHANGELOG has no ${version} section"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLFC_WARNINGS_AS_ERRORS=ON
          cmake --build build -j "$(nproc)"
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name="lfc-${VERSION}-linux-x86_64"
          cmake --install build --prefix "dist/${name}"
          mkdir -p "dist/${name}/bin"
          install -m 755 build/bench/lfc_bench "dist/${name}/bin/"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS && cat SHA256SUMS
      - name: Extract release notes
        run: |
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md
          cat dist/NOTES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            "dist/lfc-${VERSION}-linux-x86_64.tar.gz" dist/SHA256SUMS \
            --title "lockfree-containers ${TAG}" \
            --notes-file dist/NOTES.md \
            --verify-tag
