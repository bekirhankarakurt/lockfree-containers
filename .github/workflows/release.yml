name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "VERSION ${version}" CMakeLists.txt || { echo "tag ${GITHUB_REF_NAME} != CMake version"; exit 1; }
          grep -q "## \[${version}\]" CHANGELOG.md || { echo "CHANGELOG has no ${version} section"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLFC_WARNINGS_AS_ERRORS=ON
          cmake --build build -j "$(nproc)"
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name="lfc-${VERSION}-linux-x86_64"
          cmake --install build --prefix "dist/${name}"
          mkdir -p "dist/${name}/bin"
          install -m 755 build/bench/lfc_bench "dist/${name}/bin/"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS && cat SHA256SUMS
      - name: Extract release notes
        run: |
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md
          cat dist/NOTES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/lfc-${VERSION}-linux-x86_64.tar.gz" dist/SHA256SUMS \
            --title "lockfree-containers ${GITHUB_REF_NAME}" \
            --notes-file dist/NOTES.md \
            --verify-tag
